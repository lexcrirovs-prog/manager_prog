{% extends "base.html" %}
{% block title %}Запись продажи — {{ employee.full_name }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/managers/{{ employee.id }}" class="text-sm hover:underline" style="color: var(--color-primary)">&larr; Назад к профилю</a>
    <h1 class="text-2xl font-bold mt-2">Фиксация продажи</h1>
    <p class="text-sm" style="color: var(--color-text-secondary)">{{ employee.full_name }}</p>
</div>

<div class="card p-6 max-w-2xl">
    <form method="POST" action="/managers/{{ employee.id }}/record-sale">
        <div class="space-y-4">
            {% if leads %}
            <div>
                <label class="block text-sm font-medium mb-1">Связать с существующей сделкой (необязательно)</label>
                <select name="lead_id" class="input-themed w-full">
                    <option value="">— Без привязки —</option>
                    {% for lead in leads %}
                    <option value="{{ lead.id }}">{{ lead.customer }}{% if lead.equipment %} — {{ lead.equipment }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium mb-1">Заказчик *</label>
                <input type="text" name="customer" required class="input-themed w-full" placeholder="Название компании">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Оборудование</label>
                    <input type="text" name="equipment" class="input-themed w-full" placeholder="Модель, тип">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Серийные номера</label>
                    <input type="text" name="serial_numbers" class="input-themed w-full" placeholder="Через запятую">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Сумма (₽) *</label>
                    <input type="number" name="amount" required step="0.01" class="input-themed w-full" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Скидка (%)</label>
                    <input type="number" name="discount" step="0.1" value="0" class="input-themed w-full">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Дата продажи *</label>
                    <input type="date" name="sale_date" required class="input-themed w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Дата отгрузки</label>
                    <input type="date" name="shipment_date" class="input-themed w-full">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Заметки</label>
                <textarea name="notes" rows="3" class="input-themed w-full" placeholder="Дополнительная информация..."></textarea>
            </div>

            <button type="submit" class="btn-primary w-full py-2 rounded font-medium">Сохранить продажу</button>
        </div>
    </form>
</div>
{% endblock %}
